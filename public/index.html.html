<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loose Screws Funding Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/styles.css" rel="stylesheet">
</head>
<body class="text-gray-800 h-screen flex overflow-hidden">
    
    <div id="login-view" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 fade-in">
        <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <i class="fa-solid fa-robot text-blue-600 text-4xl mb-3"></i>
                <h1 class="text-2xl font-bold">Loose Screws #22012</h1>
                <p class="text-gray-500">Internal Funding Hub</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Username</label>
                    <input type="text" id="username" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" required class="w-full border rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition-colors">Sign In</button>
            </form>
        </div>
    </div>

    <div id="app-shell" class="hidden w-full h-full flex">
        <aside class="w-64 bg-slate-900 text-white flex flex-col hidden md:flex">
            <div class="p-6">
                <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-robot text-blue-400"></i> Loose Screws</h2>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <button onclick="nav('dashboard')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-chart-pie w-6"></i> Dashboard</button>
                <button onclick="nav('grants')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-file-invoice-dollar w-6"></i> Grants</button>
                <button onclick="nav('team')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-slate-800 transition"><i class="fa-solid fa-users w-6"></i> Team</button>
            </nav>
            <div class="p-4">
                <button onclick="logout()" class="w-full text-left px-4 py-2 text-slate-400 hover:text-white transition"><i class="fa-solid fa-right-from-bracket w-6"></i> Logout</button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-slate-50 overflow-y-auto">
            <header class="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center">
                <h2 class="font-bold"><i class="fa-solid fa-robot"></i> Loose Screws</h2>
                <button onclick="logout()" class="text-sm"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </header>

            <div class="p-6 md:p-10 max-w-7xl mx-auto w-full">
                <div id="toast" class="fixed top-5 right-5 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg hidden transition-opacity z-50"></div>

                <section id="view-dashboard" class="view-section hidden fade-in space-y-6">
                    <h1 class="text-3xl font-bold text-slate-800">Overview</h1>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-slate-500 font-medium">Total Grants</h3>
                            <p id="dash-total" class="text-4xl font-bold text-slate-800 mt-2">-</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-slate-500 font-medium">Active Grants</h3>
                            <p id="dash-active" class="text-4xl font-bold text-blue-600 mt-2">-</p>
                        </div>
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100">
                            <h3 class="text-slate-500 font-medium">High Priority</h3>
                            <p id="dash-high" class="text-4xl font-bold text-red-600 mt-2">-</p>
                        </div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6">
                        <h3 class="text-lg font-bold mb-4">Upcoming Deadlines</h3>
                        <ul id="dash-deadlines" class="divide-y divide-slate-100"></ul>
                    </div>
                </section>

                <section id="view-grants" class="view-section hidden fade-in space-y-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-3xl font-bold text-slate-800">Grants Manager</h1>
                        <button onclick="toggleModal('grant-modal')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition"><i class="fa-solid fa-plus mr-2"></i> Add Grant</button>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-sm border-b">
                                    <th class="p-4 font-medium">Grant Name</th>
                                    <th class="p-4 font-medium">Owner</th>
                                    <th class="p-4 font-medium">Status</th>
                                    <th class="p-4 font-medium">Priority</th>
                                    <th class="p-4 font-medium">Deadline</th>
                                    <th class="p-4 font-medium text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="grants-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </section>
                
                <section id="view-team" class="view-section hidden fade-in space-y-6">
                    <h1 class="text-3xl font-bold text-slate-800">Team Roster</h1>
                    <div id="team-cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </section>
            </div>
        </main>
    </div>

    <!-- Add Grant Modal -->
    <div id="grant-modal" class="fixed inset-0 bg-gray-900/50 hidden items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl shadow-2xl w-full max-w-lg">
            <h2 class="text-xl font-bold mb-4">Add New Grant</h2>
            <form id="add-grant-form" class="space-y-4">
                <input type="text" id="g-name" placeholder="Grant Name" required class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="g-owner" placeholder="Owner Name" class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500">
                    <input type="date" id="g-deadline" class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <select id="g-priority" class="w-full border p-2 rounded outline-none">
                        <option value="Low">Low</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="High">High</option>
                    </select>
                    <select id="g-status" class="w-full border p-2 rounded outline-none">
                        <option value="Researching">Researching</option>
                        <option value="Preparing">Preparing</option>
                        <option value="Submitted">Submitted</option>
                        <option value="Awarded">Awarded</option>
                    </select>
                </div>
                <input type="url" id="g-url" placeholder="Application URL" class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-blue-500">
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="toggleModal('grant-modal')" class="px-4 py-2 text-gray-500">Cancel</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg">Save Grant</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/app.js"></script>
</body>
</html>
